<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Shoe Search</title>
<style>
  body{font:16px system-ui;margin:0 auto;max-width:960px;padding:16px;background:#fff;color:#111}
  form{display:flex;gap:8px}input{flex:1;padding:10px;font-size:16px}button{padding:10px 16px}
  #why{color:#555;margin:12px 0;font-size:14px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .card{border:1px solid #ddd;border-radius:8px;padding:8px;font-size:14px}
  .card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;background:#eee}
  @media(prefers-color-scheme:dark){body{background:#111;color:#eee}.card{border-color:#333}#why{color:#aaa}}
</style>
<h1>Shoe search</h1>
<form id="f"><input id="q" placeholder="boots for rainy season" autofocus aria-label="Search"><button>Search</button></form>
<p id="why" aria-live="polite"></p><div id="grid"></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
$("f").onsubmit=async e=>{
  e.preventDefault(); $("why").textContent="Searching…";
  try{
    const r=await fetch("/api/search?q="+encodeURIComponent($("q").value));
    if(!r.ok) throw new Error(await r.text());
    const {intent,results,message}=await r.json();
    $("why").textContent=message||(intent.llm?`Understood as: "${intent.query}"`+(intent.gender?` · ${intent.gender}`:"")+(intent.types.length?` · ${intent.types.join(", ")}`:""):"LLM unavailable, matched on your raw words.");
    $("grid").innerHTML=results.map(p=>`<div class="card"><img loading="lazy" src="${esc(p.image)}" alt="${esc(p.name)}"><b>${esc(p.name)}</b><br>${esc(p.type)} · ${esc(p.gender)} · ${esc(p.colour)}</div>`).join("");
  }catch(err){$("why").textContent="Error: "+err.message}
};
</script>
